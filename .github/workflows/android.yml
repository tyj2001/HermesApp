name: Build APK

on:
  push:
    branches: [ main ]
}
workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          enable-ndk: true
          enable-cmake: true

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Clone submodules
        run: |
          # Clone terminal submodule
          git clone https://github.com/SelectX0ob/HermesTerminalCore.git
          # Clone ncnn submodule
          mkdir -p app/src/main/cpp/thirdparty
          git clone https://github.com/Tencent/ncnn.git app/src/main/cpp/thirdparty/ncnn
          # Clone sherpa-ncnn submodule
          git clone https://github.com/k2-fsa/sherpa-ncnn.git app/src/main/cpp/thirdparty/sherpa-ncnn
          # Verify cloned
          ls -a app/src/main/cpp/thirdparty/
          [ -d "app/src/main/cpp/thirdparty/sherpa-ncnn" ] || { echo "ERROR: sherpa-ncnn missing!"; exit 1; }
          [ -d "app/src/main/cpp/thirdparty/ncnn" ] || { echo "ERROR: ncnn missing!"; exit 1; }
          [ -d "terminal" ] || { echo "ERROR: terminal missing!"; exit 1; }

      - name: Build Debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace 2>&1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-debw
          path: app/build/outputs/apk/debug/*.apk